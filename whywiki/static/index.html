<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WhyWiki</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-home">
      <button id="backToProjectsButton" class="sidebar-back-button" type="button" aria-label="Back to projects" title="Back to projects">
        <svg class="back-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M9.8 3.2 5 8l4.8 4.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="homeBrandButton" class="brand-button" type="button" aria-label="WhyWiki home" title="WhyWiki home">
        <span>WhyWiki</span>
      </button>
    </div>
    <nav data-workspace-nav>
      <button data-view="home" data-i18n="nav.home">Home</button>
      <button data-view="requirements" data-i18n="nav.requirements">Requirements</button>
      <button data-view="review" data-i18n="nav.conflicts">Conflicts</button>
      <button data-view="sources" data-i18n="nav.sources">Sources</button>
      <button data-view="ask" data-i18n="nav.ask">Ask</button>
      <button data-view="settings" data-i18n="nav.settings">Settings</button>
    </nav>
    <section class="collaboration-panel" aria-label="Collaboration">
      <div class="collaboration-panel__row">
        <span data-i18n="accountStatusLabel">Accounts</span>
        <span id="accountStatus" class="status-pill">Not connected</span>
      </div>
      <div id="accountStatusDetail" class="account-status-detail"></div>
      <div class="collaboration-panel__actions">
        <button id="manageAccountsButton" class="secondary-action" type="button" data-i18n="auth.manageAccounts">Manage accounts</button>
      </div>
      <div class="collaboration-panel__row">
        <span data-i18n="workspaceStatusLabel">Workspace</span>
        <span id="workspaceStatus" class="status-pill">Not configured</span>
      </div>
      <div id="linkedRepoStatus" class="linked-repo-status"></div>
    </section>
  </aside>
  <main class="workspace">
    <header class="topbar">
      <input id="search" placeholder="Search current project" data-i18n-placeholder="search.placeholder" />
      <div class="topbar-tools">
        <span id="current-project-name" class="project-pill"></span>
        <button class="tool-button project-tool" data-view="wiki" data-i18n="nav.wikiIndex">Wiki index</button>
        <div class="language-switch" data-active-lang="en-US" aria-label="Language">
          <button data-lang="zh-CN">中文</button>
          <button data-lang="en-US">EN</button>
        </div>
      </div>
    </header>
    <section class="dashboard">
      <div id="app"></div>
    </section>
  </main>
  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
